<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="/static/css/game.css">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
</head>
<div id="start-overlay">
  Loading...
</div>
<script src="wasm_exec.js"></script>
<script>
const go = new Go();
const overlay = document.getElementById("start-overlay");

function hasWebGL() {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) return false;

    const debugInfo = gl.getExtension("RENDERER");
      if (debugInfo) {
        const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        if (/swiftshader|software/i.test(renderer)) return false;
      }
  return true;
}

if (!hasWebGL()) {
    overlay.textContent = "Please enable hardware acceleration in your browser, then try again!"
} else {
    WebAssembly.instantiateStreaming(fetch("ragin-mages.wasm"), go.importObject).then(result => {
      go.run(result.instance);

      overlay.textContent = "CLICK TO JOIN!";
      overlay.style.cursor = "pointer";
      overlay.style.backdropFilter = "blur(12px)"
      overlay.addEventListener("click", function () {
        this.remove();
        const canvas = document.querySelector("canvas");
        canvas.tabIndex = 0;
        canvas.focus();
      }, { once: true });
    });
}
</script>
